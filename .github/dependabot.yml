version: 2

# Weekly pull requests for Rust crates and GitHub Actions; minor and patch bumps are grouped into one PR each.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types:
          - minor
          - patch
    ignore:
      # grammers-session links libsql 0.9; a second libsql copy duplicates SQLite symbols at link time.
      - dependency-name: libsql
        versions: [">= 0.10"]
      - dependency-name: libsql-sys
        versions: [">= 0.10"]
      # The digest 0.11 crypto stack must move together with sha1, sha2 and the vendored steamguard.
      - dependency-name: hmac
        versions: [">= 0.13"]
      - dependency-name: sha1
        versions: [">= 0.11"]
      - dependency-name: sha2
        versions: [">= 0.11"]
      # Argon2 salts need a rand_core 0.6 RNG, and the vendored steamguard pins rand 0.8.
      - dependency-name: rand
        versions: [">= 0.9"]
      # Tera 2 is a rewrite with template syntax changes; migrating the templates is its own project.
      - dependency-name: tera
        versions: [">= 2"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
